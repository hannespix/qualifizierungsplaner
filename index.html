.travel-panel{margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.travel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.travel-head h2{margin:0;font-size:18px}.travel-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.travel-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px}.travel-kpi{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fafbfc}.travel-kpi b{display:block;font-size:20px}.travel-kpi span{font-size:11px;color:var(--muted)}.travel-open-list{border-top:1px solid var(--line);padding:8px}.travel-row{width:100%;display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:12px;align-items:center;border:0;background:#fff;border-radius:10px;padding:10px;text-align:left;cursor:pointer}.travel-row:hover{background:#f8fafc}.travel-row .when{font-size:11px;color:var(--muted)}.travel-row .travel-title{font-weight:800;font-size:13px}.travel-row .travel-missing{font-size:11px;color:#9a5700;margin-top:2px}.travel-ok{padding:16px;color:#15803d;font-weight:750;font-size:13px}.travel-mark{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:850;white-space:nowrap}.travel-mark.ready{background:#eaf7ee;color:#137333}.travel-mark.incomplete,.travel-mark.open{background:#fff3df;color:#9a5700}.travel-mark.none{background:#f2f4f7;color:#667085}.travel-dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}.timeline-card .travel-mark{justify-self:start}.eventbadges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.gantt-label .travel-mark{grid-column:2;justify-self:start}.gantt-label.has-travel{height:66px}.gantt-row.has-travel{height:66px}.cal-event .travel-mini{font-weight:900;margin-left:3px}.travel-section{grid-column:1/-1;border-top:1px solid var(--line);margin-top:3px;padding-top:14px}.travel-section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.travel-section-head h3{margin:0;font-size:15px}.travel-section-head span{font-size:11px;color:var(--muted)}.travel-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.travel-checks{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px}.travel-check{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfc;font-size:12px;font-weight:700}.travel-check input{width:17px;height:17px;margin:0;flex:0 0 auto}.travel-note{grid-column:1/-1}.travel-help{grid-column:1/-1;font-size:11px;color:var(--muted);line-height:1.45}.travel-filter{min-width:190px;margin-left:0!important}.travel-cell{font-size:11px;line-height:1.35;max-width:240px;white-space:pre-line}.travel-cell b{display:block;font-size:11px}.travel-filter-label{font-size:11px;color:var(--muted);font-weight:800;margin-right:-4px}.print-report td.travel-print{white-space:pre-line;min-width:34mm}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.travel-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.travel-kpis{grid-template-columns:1fr 1fr}.travel-row{grid-template-columns:1fr}.travel-row>.travel-mark{justify-self:start}.travel-grid{grid-template-columns:1fr}.travel-checks{grid-template-columns:1fr}.travel-filter{width:100%}.eventbadges{justify-content:flex-start}}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.travel-kpis{grid-template-columns:1fr 1fr}.travel-head{padding:14px}.travel-kpi b{font-size:18px}}

/* V2.6 personal options */
.slim-filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.slim-filter .search{flex:1;min-width:220px}.slim-filter select{font:inherit;border:1px solid #d9dde4;border-radius:10px;background:#fff;color:var(--text);min-height:40px;padding:8px 10px}.btn-toggle.active{background:#fff7ed;border-color:#fdba74;color:#9a3412}.settings-modal{width:min(820px,100%)}.settings-sections{display:grid;gap:14px;margin-top:14px}.settings-card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fbfcfd}.settings-card h3{margin:0 0 5px;font-size:15px}.settings-card>p{margin:0 0 12px;color:var(--muted);font-size:12px}.setting-line{display:flex;align-items:flex-start;gap:10px;padding:9px 0}.setting-line input{margin-top:3px}.setting-line b{display:block;font-size:13px}.setting-line small{display:block;color:var(--muted);margin-top:2px}.optional-picker-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}.optional-picker-actions{display:flex;gap:6px}.optional-list{display:grid;gap:6px;max-height:300px;overflow:auto;padding-right:3px}.optional-choice{display:grid;grid-template-columns:auto 88px minmax(0,1fr) auto;gap:9px;align-items:center;border:1px solid #eceff3;border-radius:10px;padding:9px;background:#fff}.optional-choice .date{font-size:11px;color:var(--muted);white-space:nowrap}.optional-choice .title{font-size:12px;font-weight:750}.settings-summary{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.settings-chip{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef2f7;color:#475467}.personal-note{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}.open-tasks-panel{display:grid;gap:12px}.travel-disabled-note{padding:12px 14px;border:1px dashed #cbd5e1;border-radius:12px;color:var(--muted);font-size:12px;background:#f8fafc}.selected-optional{outline:1px solid rgba(217,119,6,.25)}
@media(max-width:700px){.optional-choice{grid-template-columns:auto minmax(0,1fr)}.optional-choice .date,.optional-choice .badge{grid-column:2}.settings-modal{padding:14px}.slim-filter .search{min-width:100%}}

  const MS_DAY = 86400000;

  function parseDateOnly(value) {
    if (value instanceof Date) return new Date(value.getFullYear(), value.getMonth(), value.getDate());
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || ''));
    if (!m) throw new Error(`Ungültiges Datum: ${value}`);
    return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  }

  function dateToISO(value) {
    const d = value instanceof Date ? value : parseDateOnly(value);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function addDays(value, days) {
    const d = parseDateOnly(value);
    d.setDate(d.getDate() + Number(days || 0));
    return dateToISO(d);
  }

  function inclusiveDays(start, end) {
    const a = parseDateOnly(start);
    const b = parseDateOnly(end);
    return Math.max(1, Math.round((b - a) / MS_DAY) + 1);
  }

  function isoWeekInfo(value) {
    const [y, m, d] = dateToISO(value).split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    let day = dt.getUTCDay();
    if (day === 0) day = 7;
    dt.setUTCDate(dt.getUTCDate() + 4 - day);
    const isoYear = dt.getUTCFullYear();
    const yearStart = new Date(Date.UTC(isoYear, 0, 1));
    const week = Math.ceil((((dt - yearStart) / MS_DAY) + 1) / 7);
    return { year: isoYear, week };
  }

  function computedKW(event) {
    const a = isoWeekInfo(event.start);
    const b = isoWeekInfo(event.end);
    if (a.year === b.year && a.week === b.week) return String(a.week);
    if (a.year === b.year) return `${a.week}–${b.week}`;
    return `${a.year}/${a.week}–${b.year}/${b.week}`;
  }

  function normalizeKW(value) {
    return String(value ?? '').trim().replace(/\s+/g, '').replace(/-/g, '–');
  }

  function kwMatches(event) {
    return normalizeKW(event.sourceKW) === normalizeKW(computedKW(event));
  }

  function mergePlanEvent(previous, incoming, options = {}) {
    const merged = { ...(previous || {}), ...(incoming || {}) };
    const protectedOptional = previous?.obligation === 'Optional' && previous?.statusOrigin === 'reference';
    if (protectedOptional) {
      merged.obligation = 'Optional';
      merged.statusOrigin = 'reference';
      merged.statusNote = previous.statusNote || 'Optional-Status aus Referenzplan beibehalten';
    } else if (incoming && Object.prototype.hasOwnProperty.call(incoming, 'obligation')) {
      merged.statusOrigin = previous && incoming.obligation === previous.obligation
        ? (previous.statusOrigin || 'reference')
        : 'manual';
    }
    return merged;
  }

  function timelinePercent(value, rangeStart, rangeEnd) {
    const start = parseDateOnly(rangeStart);
    const end = parseDateOnly(rangeEnd);
    const current = parseDateOnly(value);
    const total = Math.max(MS_DAY, end - start);
    const pct = ((current - start) / total) * 100;
    return Math.max(0, Math.min(100, Number(pct.toFixed(6))));
  }

  function timelineSpan(startValue, endValue, rangeStart, rangeEnd, minWidthPct = 0.8) {
    const leftPct = timelinePercent(startValue, rangeStart, rangeEnd);
    const endPct = timelinePercent(addDays(endValue, 1), rangeStart, rangeEnd);
    const widthPct = Math.max(minWidthPct, endPct - leftPct);
    return {
      leftPct: Math.min(100 - minWidthPct, leftPct),
      widthPct: Math.min(100 - leftPct, widthPct),
    };
  }

  function compressDayRanges(days) {
    const sorted = [...new Set(days)].sort((a, b) => a - b);
    if (!sorted.length) return [];
    const ranges = [];
    let start = sorted[0];
    let prev = sorted[0];
    for (let i = 1; i < sorted.length; i++) {
      if (sorted[i] === prev + 1) {
        prev = sorted[i];
      } else {
        ranges.push([start, prev]);
        start = prev = sorted[i];
      }
    }
    ranges.push([start, prev]);
    return ranges;
  }

  function splitWorkWeek(monday, config) {
    const base = config.base || {};
    const pieces = [];
    const add = (days, obligation, suffix) => {
      for (const [first, last] of compressDayRanges(days || [])) {
        pieces.push({
          ...base,
          id: `${base.id}-${suffix}-${first}-${last}`,
          start: addDays(monday, first - 1),
          end: addDays(monday, last - 1),
          obligation,
          statusOrigin: obligation === 'Optional' ? 'reference' : (base.statusOrigin || 'reference'),
        });
      }
    };
    add(config.optionalDays, 'Optional', 'opt');
    add(config.mandatoryDays, 'Pflicht', 'req');
    return pieces.sort((a, b) => a.start.localeCompare(b.start));
  }


  function workingDays(startValue, endValue) {
    if (!startValue || !endValue) return 0;
    let d = parseDateOnly(startValue);
    const end = parseDateOnly(endValue);
    let count = 0;
    while (d <= end) {
      const day = d.getDay();
      if (day !== 0 && day !== 6) count++;
      d.setDate(d.getDate() + 1);
    }
    return count;
  }

  function requirementProgress(events, requirementId, targetDays) {
    const blocks = (events || []).filter((event) => event.requirementId === requirementId && event.start && event.end);
    const plannedDays = blocks.reduce((sum, event) => {
      const hasManual = event.creditDays !== '' && event.creditDays !== null && event.creditDays !== undefined;
      const manual = hasManual ? Number(event.creditDays) : NaN;
      return sum + (Number.isFinite(manual) && manual >= 0 ? manual : workingDays(event.start, event.end));
    }, 0);
    const target = Math.max(0, Number(targetDays || 0));
    return {
      plannedDays,
      remainingDays: Math.max(0, target - plannedDays),
      percent: target ? Math.min(100, Math.round((plannedDays / target) * 100)) : 0,
      done: target > 0 && plannedDays >= target,
      blocks,
    };
  }

  function toGanttTask(event) {
    return {
      id: event.id,
      text: event.title,
      start: parseDateOnly(event.start),
      end: parseDateOnly(event.end),
      duration: inclusiveDays(event.start, event.end),
      progress: 0,
      type: event.kind === 'milestone' ? 'milestone' : (event.category === 'Prüfung' ? 'exam' : (event.obligation === 'Optional' ? 'optional' : (event.category === 'Prüfungsvorbereitung' ? 'prep' : 'mandatory'))),
      lazy: false,
      kw: `KW ${event.sourceKW || computedKW(event)}`,
      status: event.obligation || 'Offen',
      ort: event.location || '–',
      category: event.category || 'Sonstiges',
      sourceId: event.id,
    };
  }

  function formatRange(start, end, locale = 'de-DE') {
    const fmt = new Intl.DateTimeFormat(locale, { day: '2-digit', month: '2-digit', year: 'numeric' });
    if (start === end) return fmt.format(parseDateOnly(start));
    return `${fmt.format(parseDateOnly(start))} – ${fmt.format(parseDateOnly(end))}`;
  }

  function filterEvents(events, filters = {}) {
    const text = String(filters.search || '').trim().toLocaleLowerCase('de-DE');
    const participant = filters.participant || 'qualifier';
    const status = filters.status || 'all';
    return [...events].filter((event) => {
      const relevance = event.relevance || 'Beide';
      if (participant === 'qualifier' && relevance === 'Anwärter') return false;
      if (participant === 'trainee' && relevance === 'Qualifizierer') return false;
      if (status === 'mandatory' && event.obligation !== 'Pflicht') return false;
      if (status === 'optional' && event.obligation !== 'Optional') return false;
      if (status === 'planning' && event.planningState !== 'pending') return false;
      if (filters.year && filters.year !== 'all' && !String(event.start || '').startsWith(String(filters.year)) && !String(event.end || '').startsWith(String(filters.year))) return false;
      if (filters.category && filters.category !== 'all' && event.category !== filters.category) return false;
      if (text) {
        const hay = [event.title, event.location, event.category, event.obligation, event.sourceKW, event.notes, event.relevance].join(' ').toLocaleLowerCase('de-DE');
        if (!hay.includes(text)) return false;
      }
      return true;
    }).sort((a, b) => String(a.start || '9999').localeCompare(String(b.start || '9999')) || a.title.localeCompare(b.title, 'de'));
  }

  globalThis.LQCore = {
    addDays,
    computedKW,
    dateToISO,
    filterEvents,
    formatRange,
    inclusiveDays,
    workingDays,
    requirementProgress,
    isoWeekInfo,
    kwMatches,
    mergePlanEvent,
    parseDateOnly,
    splitWorkWeek,
    timelinePercent,
    timelineSpan,
    toGanttTask,
  };
})();
